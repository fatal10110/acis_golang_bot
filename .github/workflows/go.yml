name: Go

on:
  # Branch pushes are covered by pull_request. main pushes still run: they are
  # the only runs whose Go build cache other branches can restore.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The unit tier (docs/agents/test-strategy.md): no network, no database, no
  # server stack. The e2e scenarios are not gated here.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # setup-go keys its cache on go.sum only, so it is saved once and
          # never refreshed. Cache per commit instead.
          cache: false

      - name: Restore Go cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-test-

      # main saves only the build cache entries its own run used, so the cache
      # does not carry every earlier build forward and grow without bound. Go
      # refreshes an entry's mtime when it uses one older than an hour, so
      # backdating them all first marks every entry this run reads. Two hours
      # stays well inside Go's own 5-day trim.
      - name: Mark Go cache entries unused
        if: github.event_name == 'push'
        run: |
          mkdir -p ~/.cache/go-build
          find ~/.cache/go-build -type f -name '*-[ad]' -exec touch -d '2 hours ago' {} +
          touch "$RUNNER_TEMP/go-cache-start"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gotest.sh keeps the log to package results and failing tests' output,
      # and ends it with the slowest packages and tests. Fuzz targets run
      # their seed corpus here; fuzzing itself is a local check
      # (docs/agents/verification.md).
      - name: Test
        run: .github/scripts/gotest.sh -race ./...

      # Go skips writing an output it already holds byte for byte, so an
      # action entry written this run can name an output file left backdated;
      # keep the output of every kept entry before dropping the rest.
      - name: Drop Go cache entries this run did not use
        if: github.event_name == 'push'
        run: |
          cd ~/.cache/go-build
          find . -type f -name '*-a' -newer "$RUNNER_TEMP/go-cache-start" \
            -exec awk '{print substr($3, 1, 2) "/" $3 "-d"}' {} + | xargs -r touch -c
          find . -type f -name '*-[ad]' ! -newer "$RUNNER_TEMP/go-cache-start" -delete

      # Only main saves, so every branch can restore it.
      - name: Save Go cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ github.sha }}

  # The release ships a Windows build (release.yml): it must compile, and the
  # code that differs on Windows (the registry lock, the secret file's DACL
  # check) runs its unit tests here. No -race: it needs cgo.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # As in test: setup-go's go.sum-keyed cache is never refreshed.
          cache: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./internal/ownerfile ./internal/botregistry ./internal/botaccounts ./cmd/bots

  # The control panel's page (web/, docs/plan.md D12): the only job with Node.
  # The Go jobs build and test against the placeholder page; this one builds
  # the page and runs the panel's HTTP tests over the built assets (CSP, no
  # secret in any served file).
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Serve the built page
        working-directory: .
        run: |
          test -f internal/botpanel/web/app/index.html
          go test -count=1 ./internal/botpanel/ -run 'TestPanelSecurityHeaders|TestPanelDisabledPreset|TestPanelPlaceholderShipped'

  # Runs the linters and the gofumpt formatter from .golangci.yml.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # As in test: setup-go's go.sum-keyed cache is never refreshed.
          cache: false

      # golangci-lint-action keeps one cache entry per week and never updates
      # it, so most runs re-analyze nearly every package. Keep the analysis
      # cache per commit instead, saved by main like the test cache.
      - name: Restore lint cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
            ~/go/pkg/mod
          key: lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: lint-${{ runner.os }}-

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
          skip-cache: true

      - name: Save lint cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
            ~/go/pkg/mod
          key: lint-${{ runner.os }}-${{ github.sha }}
